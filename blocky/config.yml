connectIPVersion: v4

bootstrapDns:
  - upstream: tcp-tls:dns.google:853
    ips:
      - 8.8.8.8
      - 8.8.4.4

upstreams:
  init:
    strategy: fast
  timeout: 10s
  groups:
    default:
      - tcp+udp:192.168.1.4:5354
      - tcp+udp:192.168.1.170:5354

filtering:
  queryTypes:
    - AAAA

fqdnOnly:
  enable: true

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    adult:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn-only/hosts
    DoH:
      - https://raw.githubusercontent.com/dibdot/DoH-IP-blocklists/refs/heads/master/doh-domains.txt
  allowlists:
    ads:
      - google-ads-whitelist.txt
  clientGroupsBlock:
    default:
      - ads
    192.168.5.0/24:
      - ads
      - adult
    192.168.2.0/24:
      - ads
      - adult
      - DoH
    192.168.3.0/24:
      - ads
      - adult
      - DoH
  loading:
    downloads:
      timeout: 4m
      attempts: 5
      cooldown: 10s
    # Start answering immediately and load lists in the background, so DNS
    # isn't held up at boot if the internet (or GitHub) is slow/unreachable
    strategy: fast

caching:
  minTime: 5m
  maxTime: 30m
  prefetching: true

certFile: /certs/server.crt
keyFile: /certs/server.key

ports:
  dns: 53
  tls: 853
  http: 4000
  dohPath: /dns-query

log:
  level: warn
  format: json
  timestamp: true
  privacy: true

# Defaults to console when unset; don't log individual queries
queryLog:
  type: none
